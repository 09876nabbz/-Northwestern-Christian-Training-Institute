<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTI — Northwestern Christian Training Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght=700;900&family=Outfit:wght=300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #F5C518;
    --deep-navy: #1A1A4E;
    --crimson: #C0162C;
    --white: #FFFFFF;
    --off-white: #F9F6EE;
    --light-gold: #FFF8D6;
    --dark: #0D0D2B;
    --text-muted: #6B6B8A;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--off-white);
    color: var(--dark);
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; width: 100%; z-index: 1000;
    background: rgba(26,26,78,0.97);
    backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 5%; height: 70px;
    box-shadow: 0 2px 30px rgba(0,0,0,0.3);
    transition: background 0.3s;
  }
  nav.scrolled { background: rgba(26,26,78,1); }
  .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .nav-logo-badge {
    width: 44px; height: 44px; border-radius: 50%;
    overflow: hidden; flex-shrink: 0; background: white;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-logo-badge img { width: 100%; height: 100%; object-fit: cover; }
  .nav-logo-text { color: var(--white); }
  .nav-logo-text strong { display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
  .nav-logo-text span { font-size: 10px; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; }

  .nav-links { display: flex; gap: 28px; list-style: none; }
  .nav-links a {
    color: rgba(255,255,255,0.8); text-decoration: none;
    font-size: 14px; font-weight: 500; letter-spacing: 0.3px;
    transition: color 0.2s;
    position: relative;
  }
  .nav-links a::after {
    content: ''; position: absolute; bottom: -4px; left: 0;
    width: 0; height: 2px; background: var(--gold);
    transition: width 0.3s;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-links a:hover::after { width: 100%; }

  .nav-cta {
    background: var(--gold); color: var(--deep-navy);
    padding: 9px 22px; border-radius: 50px; font-weight: 700;
    font-size: 13px; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s;
    white-space: nowrap;
  }
  .nav-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245,197,24,0.4); }

  .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
  .hamburger span { display: block; width: 24px; height: 2px; background: var(--white); transition: 0.3s; }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--deep-navy) 0%, #2A1A6E 50%, #1A0D3E 100%);
    display: flex; align-items: center;
    position: relative; overflow: hidden;
    padding: 100px 5% 60px;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 80% 50%, rgba(245,197,24,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 300px 300px at 10% 80%, rgba(192,22,44,0.12) 0%, transparent 70%);
  }
  .hero-grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .hero-content { position: relative; z-index: 2; max-width: 650px; }

  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(245,197,24,0.15); border: 1px solid rgba(245,197,24,0.3);
    color: var(--gold); padding: 6px 16px; border-radius: 50px;
    font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    margin-bottom: 24px;
    animation: fadeUp 0.8s ease both;
  }
  .hero-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: pulse 2s infinite; }

  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.4)} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 6vw, 5rem);
    color: var(--white); line-height: 1.1;
    margin-bottom: 20px
