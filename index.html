<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Website Offline</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0c10;
      --panel: #0f1318;
      --border: #1e2530;
      --red: #ff3b3b;
      --red-dim: rgba(255, 59, 59, 0.12);
      --amber: #f5a623;
      --text: #c8d0dc;
      --muted: #4a5568;
      --mono: 'Share Tech Mono', monospace;
      --sans: 'Barlow', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
      position: relative;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* Subtle noise texture */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 99;
      opacity: 0.4;
    }

    .container {
      max-width: 640px;
      width: 100%;
      position: relative;
      z-index: 10;
      animation: fadeUp 0.8s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Top status bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 2rem;
      animation: fadeUp 0.8s 0.1s ease both;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--red); }
      50%       { opacity: 0.4; box-shadow: 0 0 2px var(--red); }
    }

    /* Main panel */
    .panel {
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 2.5rem 2.5rem 2rem;
      position: relative;
      animation: fadeUp 0.8s 0.2s ease both;
    }

    /* Corner accents */
    .panel::before, .panel::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      border-color: var(--red);
      border-style: solid;
    }
    .panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .panel::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .error-code {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--red);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
      opacity: 0.85;
    }

    h1 {
      font-family: var(--sans);
      font-weight: 600;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      line-height: 1.2;
      color: #edf2f7;
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
    }

    h1 span {
      color: var(--red);
    }

    p {
      font-weight: 300;
      font-size: 1rem;
      line-height: 1.7;
      color: var(--text);
      margin-bottom: 2rem;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(to right, var(--border), transparent);
      margin-bottom: 1.8rem;
    }

    /* Contact block */
    .contact-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .contact-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--red-dim);
      border: 1px solid rgba(255,59,59,0.35);
      color: var(--red);
      font-family: var(--mono);
      font-size: 0.85rem;
      padding: 0.65rem 1.2rem;
      text-decoration: none;
      letter-spacing: 0.06em;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      cursor: pointer;
    }

    .contact-btn:hover {
      background: rgba(255,59,59,0.22);
      border-color: rgba(255,59,59,0.7);
      color: #ff6b6b;
    }

    .contact-btn svg {
      flex-shrink: 0;
    }

    /* Footer */
    .footer {
      margin-top: 1.8rem;
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      display: flex;
      justify-content: space-between;
      animation: fadeUp 0.8s 0.35s ease both;
    }

    .timestamp {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="status-bar">
      <span class="dot"></span>
      <span>System Status: Offline</span>
    </div>

    <div class="panel">
      <div class="error-code">ERR_SERVICE_UNAVAILABLE</div>

      <h1>Website is currently <span>down.</span></h1>

      <p>
        This service is temporarily unavailable. Our team has been notified.
        If you need immediate assistance, please contact your system administrator
        to bring it back online.
      </p>

      <div class="divider"></div>

      <div class="contact-label">// Contact</div>
      <a class="contact-btn" href="mailto:admin@example.com">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        admin@example.com
      </a>
    </div>

    <div class="footer">
      <span>SYS_MONITOR_v1.0</span>
      <span class="timestamp" id="ts"></span>
    </div>

  </div>

  <script>
    const ts = document.getElementById('ts');
    function updateTime() {
      const now = new Date();
      ts.textContent = now.toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
    }
    updateTime();
    setInterval(updateTime, 1000);
  </script>

</body>
</html>
